<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  --paper:#EDF0EE; --surface:#FFF; --ink:#18241F; --muted:#6B7A72; --line:#D3DAD5;
  --indigo:#2A4759; --pine:#4F7355; --amber:#B8873A; --verm:#A64B3C;
  font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  background:var(--paper);color:var(--ink);min-height:100vh;font-size:15px;line-height:1.6;
  padding:env(safe-area-inset-top) 0 calc(40px + env(safe-area-inset-bottom));
  -webkit-text-size-adjust:100%;
}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.wrap{max-width:440px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 0 10px}
.datebtn{background:none;border:none;font-size:22px;color:var(--muted);padding:6px 14px;font-family:inherit}
.datenow{font-size:16px;font-weight:600}
.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:20px}
.tab{flex:1;background:none;border:none;padding:11px 0;font-size:15px;color:var(--muted);
  border-bottom:2px solid transparent;font-family:inherit}
.tab.on{color:var(--ink);font-weight:600;border-bottom-color:var(--indigo)}
.hero{padding:6px 0 20px}
.herolabel{font-size:14px;color:var(--muted)}
.heronum{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.heronum b{font-size:56px;font-weight:700;line-height:1.05}
.heronum span{font-size:16px;color:var(--muted)}
.gauge{margin-top:16px;position:relative;height:28px}
.grail{position:absolute;top:8px;left:0;right:0;height:3px;background:var(--line);border-radius:2px}
.gfill{position:absolute;top:8px;left:0;height:3px;border-radius:2px;transition:width .35s}
.tick{position:absolute;top:3px;width:1px;height:13px;background:var(--muted);opacity:.5}
.ticklab{position:absolute;top:19px;font-size:10px;color:var(--muted);transform:translateX(-50%)}
.row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}
.rows{border-top:1px solid var(--line)}
.rowname{font-size:14px;color:var(--muted)}
.rowval{font-size:16px;font-weight:600}
.bar{height:2px;background:var(--line);border-radius:1px;margin-top:6px;overflow:hidden}
.barf{height:100%;transition:width .35s}
.checks{display:flex;gap:8px;padding:14px 0}
.chk{flex:1;text-align:center;padding:9px 4px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:var(--surface)}
.chk.ok{border-color:var(--pine);color:var(--pine);font-weight:600}
.sec{margin-top:24px}
.sectitle{font-size:14px;color:var(--muted);margin-bottom:10px}
.inputrow{display:flex;gap:8px}
.inputrow input{flex:1;padding:13px 14px;font-size:16px;border:1px solid var(--line);border-radius:10px;
  background:var(--surface);font-family:inherit;color:var(--ink);min-width:0}
.addbtn{padding:0 20px;background:var(--indigo);color:#fff;border:none;border-radius:10px;
  font-size:15px;font-weight:600;font-family:inherit;white-space:nowrap}
.hint{font-size:12px;color:var(--muted);margin-top:7px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.chip{padding:8px 13px;background:var(--surface);border:1px solid var(--line);border-radius:18px;
  font-size:14px;font-family:inherit;color:var(--ink)}
.chip:active{background:var(--indigo);color:#fff}
.item{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.itemL{display:flex;flex-direction:column;gap:2px;min-width:0}
.itemname{font-size:15px;font-weight:500}
.itemsub{font-size:12px;color:var(--muted)}
.itemR{display:flex;align-items:center;gap:14px;flex-shrink:0}
.itemnum{font-size:15px;font-weight:600;text-align:right}
.del{background:none;border:none;color:var(--muted);font-size:20px;padding:2px 4px;font-family:inherit}
.empty{padding:26px 0;text-align:center;color:var(--muted);font-size:14px}
.sug{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 14px;margin-top:14px}
.sugtitle{font-size:13px;color:var(--muted);margin-bottom:7px}
.sugitems{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px}
.warn{background:#F7EDE9;border:1px solid var(--verm);color:var(--verm);border-radius:10px;
  padding:11px 13px;font-size:13px;margin-top:14px}
.wform{display:flex;gap:7px;margin-top:10px}
.wform input{padding:12px 10px;font-size:16px;border:1px solid var(--line);border-radius:9px;
  background:var(--surface);font-family:inherit;width:100%;min-width:0;color:var(--ink)}
.wsel{width:100%;padding:13px 12px;font-size:16px;border:1px solid var(--line);border-radius:10px;
  background:var(--surface);font-family:inherit;color:var(--ink)}
.lastrec{font-size:12px;color:var(--indigo);margin-top:8px;font-weight:500}
.setgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.setgrid label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
.setgrid input{width:100%;padding:10px;font-size:16px;border:1px solid var(--line);border-radius:8px;
  background:var(--surface);font-family:inherit;color:var(--ink)}
.link{background:none;border:none;color:var(--muted);font-size:13px;text-decoration:underline;font-family:inherit;padding:0}
.hidden{display:none}

/* ---- リスト・設定画面 ---- */
.chiphead{font-size:13px;color:var(--muted);margin-top:18px}
.chiphead+.chips{margin-top:8px}
.srow{gap:10px}
.srow .itemR{gap:6px}
.sname{flex:1;min-width:0;background:none;border:none;padding:2px 0;text-align:left;font-family:inherit;
  color:inherit;display:flex;flex-direction:column;gap:2px}
.sname .itemname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mv{width:34px;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);
  font-size:16px;font-family:inherit;padding:0;display:inline-flex;align-items:center;justify-content:center}
.mv:disabled{opacity:.3}
.editor{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 12px 14px;margin:8px 0 12px}
.editor .setgrid:first-child{margin-top:0}
.span2{grid-column:1/3}
.setgrid select{width:100%;padding:10px;font-size:16px;border:1px solid var(--line);border-radius:8px;
  background:var(--surface);font-family:inherit;color:var(--ink)}
.tagrow{display:flex;gap:14px;flex-wrap:wrap;margin-top:2px}
.tagrow label{font-size:14px;color:var(--ink);display:flex;align-items:center;gap:6px;margin:0;white-space:nowrap}
.tagrow input{width:18px;height:18px;padding:0;margin:0;flex-shrink:0}
.edbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.edbtns .addbtn{padding:12px 22px}
.ghost{padding:12px 16px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;
  font-size:15px;font-family:inherit}
.ghost.danger{color:var(--verm);border-color:var(--verm)}
.notice{font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;
  margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.notice button{background:none;border:none;color:var(--indigo);font-weight:600;font-size:13px;font-family:inherit;padding:0;white-space:nowrap}
.errmsg{color:var(--verm)}
.addsel{margin-top:12px}
@keyframes flash{from{background:rgba(79,115,85,.18)}to{background:transparent}}
.flash{animation:flash .9s ease-out}
@media (prefers-reduced-motion:reduce){.flash{animation:none}.gfill,.barf{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <button class="datebtn" id="prevDay" aria-label="前の日">‹</button>
    <div class="datenow num" id="dateLabel"></div>
    <button class="datebtn" id="nextDay" aria-label="次の日">›</button>
  </div>

  <div class="tabs">
    <button class="tab on" id="tabFood">食事</button>
    <button class="tab" id="tabGym">トレーニング</button>
    <button class="tab" id="tabSet">設定</button>
  </div>

  <!-- 食事 -->
  <div id="foodPane">
    <div class="hero">
      <div class="herolabel">たんぱく質</div>
      <div class="heronum num"><b id="pNum">0</b><span id="pSub"></span></div>
      <div class="gauge">
        <div class="grail"></div>
        <div class="gfill" id="pFill" style="width:0"></div>
        <div id="ticks"></div>
      </div>
    </div>

    <div id="sugBox" class="sug hidden">
      <div class="sugtitle" id="sugTitle"></div>
      <div class="sugitems num" id="sugItems"></div>
    </div>

    <div id="isoWarn" class="warn hidden"></div>

    <div class="sec">
      <div class="rows">
        <div style="padding:11px 0;border-bottom:1px solid var(--line)">
          <div style="display:flex;justify-content:space-between">
            <span class="rowname">カロリー</span><span class="rowval num" id="kcalVal"></span>
          </div>
          <div class="bar"><div class="barf" id="kcalBar" style="width:0;background:var(--indigo)"></div></div>
        </div>
        <div style="padding:11px 0;border-bottom:1px solid var(--line)">
          <div style="display:flex;justify-content:space-between">
            <span class="rowname">イソフラボン</span><span class="rowval num" id="isoVal"></span>
          </div>
          <div class="bar"><div class="barf" id="isoBar" style="width:0"></div></div>
        </div>
        <div class="row"><span class="rowname">炭水化物</span><span class="rowval num" id="cVal"></span></div>
        <div class="row"><span class="rowname">脂質</span><span class="rowval num" id="fVal"></span></div>
        <div class="row"><span class="rowname">カルシウム</span><span class="rowval num" id="caVal"></span></div>
        <div class="row"><span class="rowname">ビタミンE</span><span class="rowval num" id="veVal"></span></div>
      </div>
      <div class="checks">
        <div class="chk" id="chkGreens">緑黄色野菜</div>
        <div class="chk" id="chkFish">魚</div>
        <div class="chk" id="chkFerment">発酵食品</div>
      </div>
    </div>

    <div class="sec">
      <div class="inputrow">
        <input id="foodInput" placeholder="卵3 鮭2 ご飯1.2合 豚こま300g">
        <button class="addbtn" id="addBtn">追加</button>
      </div>
      <div class="hint" id="hintText"></div>
      <div id="chips"></div>
      <button class="link" id="toSettings" style="margin-top:14px">リストを並べ替える・編集する</button>
    </div>

    <div class="sec">
      <div class="sectitle">食べたもの</div>
      <div id="mealList"></div>
    </div>
  </div>

  <!-- トレーニング -->
  <div id="gymPane" class="hidden">
    <div class="sec" style="margin-top:0">
      <div class="sectitle">種目</div>
      <select class="wsel" id="exSel"></select>
      <div class="lastrec hidden" id="lastRec"></div>
      <div class="wform">
        <input type="number" inputmode="decimal" id="kgIn" placeholder="kg">
        <input type="number" inputmode="numeric" id="repIn" placeholder="回">
        <button class="addbtn" id="wAdd">記録</button>
      </div>
      <div class="hint">RIR 1〜2で止める。挙上時に息を吐く。1RM試技はしない。</div>
    </div>
    <div class="sec">
      <div class="sectitle" id="setCount">今日のセット</div>
      <div id="workoutList"></div>
    </div>
  </div>

  <!-- 設定 -->
  <div id="setPane" class="hidden"></div>
</div>

  FOODS.forEach(f=>{f._al=(f.alias&&f.alias.length?f.alias:[f.name]).map(normalize)});
}

}

/* ---------- 入力解析 ---------- */
const UNIT_RE=/(グラム|g|ミリ|ml|切れ|切|合|パック|杯|本|缶|玉|枚|食|個|つ|粒|丁)/;
const GRAM_UNITS=["g","グラム","ml","ミリ"];
const LONE_NUM=/^[0-9.\/半分]+(グラム|g|ミリ|ml|切れ|切|合|パック|杯|本|缶|玉|枚|食|個|つ|粒|丁)?$/;

function matchFood(raw){
  let best=null;
  for(const f of FOODS){
    if(f.deleted)continue;
    for(const a of f._al){
      if(!a)continue;
      const i=raw.indexOf(a);
      if(i<0)continue;
      // 長い呼び名を優先。同じ長さなら前にあるほう（牛もも肉 → 牛もも）
      if(!best||a.length>best.a.length||(a.length===best.a.length&&i<best.i))best={f,a,i};
    }
  }
  return best;
}
function readNum(rest){
  let num=null;
  const fr=rest.match(/([0-9]+)\/([0-9]+)/);
  if(fr&&+fr[2]>0)num=+fr[1]/+fr[2];
  else{const m=rest.match(/([0-9]+(?:\.[0-9]+)?)/);if(m)num=parseFloat(m[1]);}
  if(/半/.test(rest))num=(num===null?0:num)+.5;     // 「半分」「1合半」
  return num;
}
function calcQty(f,num,unit){
  if(num===null)return 1;                              // 数字なし →「1人前」
  const isGram=!!unit&&GRAM_UNITS.indexOf(unit)>=0;
  const isOther=!!unit&&!isGram;
  if(f.type==="weight"){
    if(isOther)return f.pieceG?num*f.pieceG/100:num;   // ささみ3本・3切れ
    if(!isGram&&num<1)return num;                      // 「半分」は100gの半分
    return num/100;                                    // 数字はグラム
  }
  if(isGram)return f.g?num/f.g:num;                    // 鮭160g → 2切れ
  if(isOther)return num;                               // ビール2杯・卵3個
  if(/^[0-9]+(g|ml)$/.test(f.unit)&&f.g)               // 豆乳・ヨーグルト・キムチなど
    return num>=Math.min(10,f.g)?num/f.g:num;          // 豆乳200→200ml、ビール2→2本
  if(f.g&&num>=20)return num/f.g;                      // ご飯200 → 200g
  return num;
}
function parseInput(text){
  const chunks=normalize(text).split(/[\s,、・()\[\]「」【】]+/).filter(Boolean);
  const hits=[],misses=[];let waiting=null;
  for(const raw of chunks){
    const m=matchFood(raw);
    if(!m){
      if(LONE_NUM.test(raw)){                           // 「鶏もも 200g」の 200g
        if(waiting){const um=raw.match(UNIT_RE);
          waiting.hit.qty=r3(calcQty(waiting.f,readNum(raw),um?um[1]:null));waiting=null;}
        continue;
      }
      misses.push(raw);waiting=null;continue;
    }
    const rest=raw.slice(0,m.i)+raw.slice(m.i+m.a.length);
    const num=readNum(rest),um=rest.match(UNIT_RE);
    const hit={foodId:m.f.id,qty:r3(calcQty(m.f,num,um?um[1]:null))};
    hits.push(hit);
    waiting=num===null?{f:m.f,hit}:null;
  }
  return{hits,misses};
}

function calcTotals(meals){
  const t={p:0,kcal:0,c:0,f:0,ca:0,ve:0,iso:0};const tags=new Set();
  for(const m of meals){const f=foodById(m.foodId);if(!f)continue;
    for(const k in t)t[k]+=(f.n[k]||0)*m.qty;
    (f.tag||[]).forEach(x=>tags.add(x));}
  return{t,tags};
}
function qtyLabel(f,q){
  if(f.type==="weight")return Math.round(q*100)+"g";
  const m=f.unit.match(/^([0-9]+)(g|ml)$/);
  if(m)return Math.round(q*Number(m[1]))+m[2];      // 豆乳200ml / キムチ50g など
  const r=Math.round(q*10)/10;
  if(/^(大さじ|小さじ)$/.test(f.unit))return f.unit+r;
  return r+f.unit;
}
function perLabel(f){
  if(f.type==="weight")return "100gあたり";
  if(/^[0-9]+(g|ml)$/.test(f.unit))return f.unit+"あたり";
  const g=f.g?`（${f.g}g）`:"";
  if(/^(大さじ|小さじ)$/.test(f.unit))return f.unit+"1"+g+"あたり";
  return "1"+f.unit+g+"あたり";
}

    $(t).className="tab"+(tab===k?" on":"");
  });

}

function renderChips(){
  let h="";
  LIST_META.forEach(([key,label])=>{
    const fs=LISTS[key].map(foodById).filter(f=>f&&!f.deleted);
    if(!fs.length)return;
    h+=`<div class="chiphead">${label}</div><div class="chips">`+
      fs.map(f=>`<button class="chip" data-add="${esc(f.id)}">${esc(f.name)}${f.type==="weight"?" 100g":""}</button>`).join("")+
      `</div>`;
  });
  $("chips").innerHTML=h||'<div class="hint">リストが空です。設定から食材を足せます。</div>';
}

function renderFood(){
  const{t,tags}=calcTotals(day.meals);
  const remain=settings.pTarget-t.p;
  const color=t.p<settings.pMin?"var(--amber)":t.p>settings.pMax+10?"var(--amber)":"var(--pine)";
  $("pNum").textContent=Math.round(t.p);
  $("pNum").style.color=color;
  $("pSub").textContent=`/ ${settings.pTarget}g　${remain>0?"あと "+Math.round(remain)+"g":"達成"}`;
  const gmax=settings.pMax+30;
  $("pFill").style.width=Math.min(100,t.p/gmax*100)+"%";
  $("pFill").style.background=color;
  $("ticks").innerHTML=[settings.pMin,settings.pTarget,settings.pMax].map(v=>{
    const l=v/gmax*100;
    return `<div class="tick" style="left:${l}%"></div><div class="ticklab num" style="left:${l}%">${v}</div>`;
  }).join("");

  // 提案
  const sug=["egg","salmon","sasami","natto"].map(foodById).filter(f=>f&&f.n.p>0);
  if(remain>0&&day.meals.length>0&&sug.length){
    $("sugBox").classList.remove("hidden");
    $("sugTitle").textContent=`あと ${Math.round(remain)}g を満たすなら`;
    $("sugItems").innerHTML=sug.map(f=>{
      const need=remain/f.n.p;
      const txt=f.type==="weight"?Math.round(need*100/10)*10+"g":qtyLabel(f,Math.ceil(need*10)/10);
      return `<span>${esc(f.name)} ${txt}</span>`;}).join("");
  }else $("sugBox").classList.add("hidden");

  // イソフラボン警告
  if(t.iso>settings.isoLimit){
    $("isoWarn").classList.remove("hidden");
    $("isoWarn").textContent=`イソフラボンが ${Math.round(t.iso)}mg。上限の目安 ${settings.isoLimit}mg を超えています。これ以降は大豆（納豆・豆腐・豆乳・ソイプロテイン）を足さず、魚・卵・肉で補ってください。`;
  }else $("isoWarn").classList.add("hidden");

  const rk=settings.kcalTarget-t.kcal;
  $("kcalVal").innerHTML=`${Math.round(t.kcal).toLocaleString()} / ${settings.kcalTarget.toLocaleString()}`+
    (rk>0?`<span style="color:var(--muted);font-weight:400;font-size:13px">　あと ${Math.round(rk)}</span>`:"");
  $("kcalBar").style.width=Math.min(100,t.kcal/settings.kcalTarget*100)+"%";
  $("isoVal").textContent=`${Math.round(t.iso)} / ${settings.isoLimit}mg`;
  $("isoVal").style.color=t.iso>settings.isoLimit?"var(--verm)":"inherit";
  $("isoBar").style.width=Math.min(100,t.iso/settings.isoLimit*100)+"%";
  $("isoBar").style.background=t.iso>settings.isoLimit?"var(--verm)":"var(--pine)";
  $("cVal").textContent=Math.round(t.c)+"g";
  $("fVal").textContent=Math.round(t.f)+"g";
  $("caVal").textContent=`${Math.round(t.ca)} / ${settings.caTarget}mg`;
  $("veVal").textContent=`${Math.round(t.ve*10)/10} / ${settings.veTarget}mg`;
  $("chkGreens").className="chk"+(tags.has("greens")?" ok":"");
  $("chkFish").className="chk"+(tags.has("fish")?" ok":"");
  $("chkFerment").className="chk"+(tags.has("ferment")?" ok":"");

  renderChips();

  $("mealList").innerHTML=day.meals.length===0?'<div class="empty">まだ記録がありません</div>':
    day.meals.map((m,i)=>{const f=foodById(m.foodId);if(!f)return"";
      return `<div class="item"><div class="itemL"><span class="itemname">${esc(f.name)}</span>
        <span class="itemsub num">${qtyLabel(f,m.qty)}　${Math.round(f.n.kcal*m.qty)}kcal</span></div>
        <div class="itemR"><span class="itemnum num">${Math.round(f.n.p*m.qty*10)/10}g</span>
        <button class="del" data-del="${i}" aria-label="${esc(f.name)}を消す">×</button></div></div>`;}).join("");
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
    day.meals.splice(+b.dataset.del,1);saveDay();render();});
}

function renderGym(){
  const ex=$("exSel").value;
  // 過去14日から前回記録を探す
  let last=null;
  for(let i=1;i<=14&&!last;i++){
    const d=new Date(date);d.setDate(d.getDate()-i);
    const v=LS.get("log:"+todayKey(d),null);
    if(v&&v.workouts)for(const w of v.workouts)if(w.ex===ex&&!last)last=Object.assign({},w,{date:todayKey(d)});
  }
  if(last){$("lastRec").classList.remove("hidden");
    $("lastRec").textContent=`前回 ${last.date.slice(5)}　${last.kg}kg × ${last.reps}回`;}
  else $("lastRec").classList.add("hidden");

  $("setCount").textContent=`今日のセット（${day.workouts.length}）`;
  if(day.workouts.length===0){$("workoutList").innerHTML='<div class="empty">まだ記録がありません</div>';return}
  const g={};day.workouts.forEach((w,i)=>{(g[w.ex]=g[w.ex]||[]).push(Object.assign({},w,{i}))});
  $("workoutList").innerHTML=Object.entries(g).map(([name,sets])=>
    `<div style="margin-bottom:18px"><div style="font-size:14px;font-weight:600;margin-bottom:4px">${esc(name)}</div>`+
    sets.map((s,n)=>`<div class="item"><span class="itemsub num">${n+1}セット目</span>
      <div class="itemR"><span class="itemnum num">${s.kg}kg × ${s.reps}回</span>
      <button class="del" data-wdel="${s.i}" aria-label="このセットを消す">×</button></div></div>`).join("")+"</div>").join("");
  document.querySelectorAll("[data-wdel]").forEach(b=>b.onclick=()=>{
    day.workouts.splice(+b.dataset.wdel,1);saveDay();render();});
}

/* ---------- 設定画面 ---------- */
let openEd=null;        // {list,idx}=そのリストの行を編集中 / "create"=新しい食材 / null
let notices={};         // リストごとのお知らせ {text, undo}
let createMsg="",setMsg="";
const clearMsgs=()=>{notices={};createMsg="";setMsg="";};

function rowHTML(key,i,f,isLast){
  return `<div class="item srow" data-row="${key}:${i}">
    <button class="sname" data-edit="${key}:${i}">
      <span class="itemname">${esc(f.name)}</span>
      <span class="itemsub num">${perLabel(f)}　たんぱく質${fmt(f.n.p)}g${f.edited?"　修正済み":""}</span>
    </button>
    <div class="itemR">
      <button class="mv" data-mv="${key}:${i}:-1" aria-label="${esc(f.name)}を上へ"${i===0?" disabled":""}>↑</button>
      <button class="mv" data-mv="${key}:${i}:1" aria-label="${esc(f.name)}を下へ"${isLast?" disabled":""}>↓</button>
      <button class="del" data-rm="${key}:${i}" aria-label="${esc(f.name)}をリストから外す">×</button>
    </div>
  </div>`;
}

function numField(key,label,val,ph,wide){
  return `<div${wide?' class="span2"':""}><label>${label}</label><input type="number" inputmode="decimal" step="any" data-f="${key}" value="${val===null||val===undefined?"":esc(val)}" placeholder="${ph}"></div>`;
}
function editorHTML(f,mode){
  const create=mode==="create";
  const n=f?f.n:{};
  const tags=new Set(f&&f.tag?f.tag:[]);
  const tagBox=(k,l)=>`<label><input type="checkbox" data-tag="${k}"${tags.has(k)?" checked":""}> ${l}</label>`;
  let h=`<div class="editor" id="editor"><div class="setgrid">
    <div class="span2"><label>名前</label><input data-f="name" value="${f?esc(f.name):""}" placeholder="例：ホッケ"></div>
    <div class="span2"><label>呼び名（カンマ区切り・入力欄で使う）</label><input data-f="alias" value="${f?esc((f.alias||[]).join(",")):""}" placeholder="例：ほっけ,ホッケ"></div>`;
  if(create){
    h+=`<div class="span2"><label>数え方</label><select data-f="type">
        <option value="weight">グラムで数える（肉・魚・野菜）</option>
        <option value="count">個数で数える（卵・パックなど）</option></select></div>
      <div class="hidden" data-countonly><label>単位（個・切れ・杯など）</label><input data-f="unit" placeholder="切れ"></div>
      <div class="hidden" data-countonly><label>1単位のグラム</label><input type="number" inputmode="decimal" step="any" data-f="g" placeholder="80"></div>`;
  }
  h+=`</div><div class="hint" data-basis style="margin:12px 0 0">↓ ${create?"100gあたり":perLabel(f)}の数値</div>
    <div class="setgrid">
      ${numField("p","たんぱく質 g",create?null:n.p,"17")}
      ${numField("kcal","カロリー kcal",create?null:n.kcal,"110")}
      ${numField("c","炭水化物 g",create?null:n.c,"0")}
      ${numField("f","脂質 g",create?null:n.f,"0")}
      ${numField("ca","カルシウム mg",create?null:n.ca,"0")}
      ${numField("ve","ビタミンE mg",create?null:n.ve,"0")}
      ${numField("iso","イソフラボン mg（大豆製品のみ）",create?null:n.iso,"0",true)}
      <div class="span2"><label>種類</label><div class="tagrow">${tagBox("fish","魚")}${tagBox("greens","緑黄色野菜")}${tagBox("ferment","発酵食品")}${tagBox("soy","大豆")}</div></div>`;
  if(create)h+=`<div class="span2"><label>入れるリスト</label><select data-f="list">
      <option value="main">たんぱく質・炭水化物</option><option value="beauty">美容</option>
      <option value="">リストには入れない（入力欄だけで使う）</option></select></div>`;
  h+=`</div><div class="edbtns"><button class="addbtn" data-act="save">${create?"食材を作る":"保存"}</button>
    <button class="ghost" data-act="cancel">やめる</button>`;
  if(!create&&isBuiltin(f.id)&&f.edited)h+=`<button class="ghost" data-act="reset">元の値に戻す</button>`;
  if(!create&&!isBuiltin(f.id))h+=`<button class="ghost danger" data-act="delete">この食材を削除</button>`;
  h+=`</div>`;
  if(!create)h+=`<div class="hint">直した値は、過去の記録にも反映されます。</div>`;
  h+=`<div class="hint errmsg" data-f="msg"></div></div>`;
  return h;
}

function renderSettings(){
  cleanLists();
  let h="";
  LIST_META.forEach(([key,label],li)=>{
    const ids=LISTS[key];
    h+=`<div class="sec"${li===0?' style="margin-top:0"':""}><div class="sectitle">${label}のリスト（${ids.length}）</div>`;
    if(li===0)h+=`<div class="hint" style="margin:-4px 0 12px">名前をタップすると、たんぱく質などの値を直せます。↑↓で並べ替え、×でリストから外します。</div>`;
    const nt=notices[key];
    if(nt)h+=`<div class="notice"><span>${esc(nt.text)}</span>${nt.undo?`<button data-undo="${key}">元に戻す</button>`:""}</div>`;
    h+=`<div class="rows">`;
    if(!ids.length)h+=`<div class="empty">リストが空です</div>`;
    ids.forEach((id,i)=>{
      const f=foodById(id);
      h+=rowHTML(key,i,f,i===ids.length-1);
      if(openEd&&openEd.list===key&&openEd.idx===i)h+=editorHTML(f,"edit");
    });
    h+=`</div>`;
    const addable=activeFoods().filter(f=>ids.indexOf(f.id)<0);
    const mine=addable.filter(f=>!isBuiltin(f.id)),built=addable.filter(f=>isBuiltin(f.id));
    const opt=f=>`<option value="${esc(f.id)}">${esc(f.name)}</option>`;
    h+=`<select class="wsel addsel" data-addto="${key}" aria-label="${label}のリストに食材を足す">
      <option value="">＋ このリストに食材を足す</option>
      ${mine.length?`<optgroup label="自分で作った食材">${mine.map(opt).join("")}</optgroup>`:""}
      <optgroup label="登録済みの食材">${built.map(opt).join("")}</optgroup>
    </select></div>`;
  });

  h+=`<div class="sec"><div class="sectitle">新しい食材</div>`;
  if(createMsg)h+=`<div class="notice"><span>${esc(createMsg)}</span></div>`;
  h+=openEd==="create"?editorHTML(null,"create"):
    `<button class="ghost" data-act="create" style="width:100%">新しい食材を作る</button>
     <div class="hint">栄養値がわからない食材は、Claudeに「◯◯の栄養は?」と聞いて入れてください。</div>`;
  h+=`</div>`;

  h+=`<div class="sec"><div class="sectitle">目標</div><div class="setgrid" style="margin-top:0">`+
    GOALS.map(([k,l])=>`<div><label>${l}</label><input type="number" inputmode="decimal" data-set="${k}" value="${settings[k]}"></div>`).join("")+
    `</div></div>`;

  h+=`<div class="sec">${setMsg?`<div class="notice"><span>${esc(setMsg)}</span></div>`:""}
    <button class="link" data-act="resetLists">リストを最初の並びに戻す</button></div>`;
  $("setPane").innerHTML=h;
}

const rowEl=(k,i)=>document.querySelector(`[data-row="${k}:${i}"]`);
function flashRow(k,i){const el=rowEl(k,i);if(el)el.classList.add("flash");}

function moveItem(k,i,dir){
  const L=LISTS[k],j=i+dir;
  if(j<0||j>=L.length)return;
  clearMsgs();
  const before=rowEl(k,i)?rowEl(k,i).getBoundingClientRect().top:null;
  const tmp=L[i];L[i]=L[j];L[j]=tmp;
  if(openEd&&openEd.list===k){if(openEd.idx===i)openEd.idx=j;else if(openEd.idx===j)openEd.idx=i;}
  saveLists();renderSettings();
  const el=rowEl(k,j);
  if(el&&before!==null)window.scrollBy(0,el.getBoundingClientRect().top-before); // 動かした行を指の下に保つ
  flashRow(k,j);
}
function removeItem(k,i){
  const id=LISTS[k][i],f=foodById(id);
  clearMsgs();
  LISTS[k].splice(i,1);
  if(openEd&&openEd.list===k){if(openEd.idx===i)openEd=null;else if(openEd.idx>i)openEd.idx--;}
  saveLists();
  notices[k]={text:`「${f?f.name:""}」をリストから外しました`,undo:{i,id}};
  renderSettings();
}
function undoRemove(k){
  const n=notices[k];if(!n||!n.undo)return;
  const u=n.undo,pos=Math.min(u.i,LISTS[k].length);
  clearMsgs();
  if(LISTS[k].indexOf(u.id)<0)LISTS[k].splice(pos,0,u.id);
  saveLists();renderSettings();flashRow(k,pos);
}

function readEditor(root,create){
  const q=k=>root.querySelector(`[data-f="${k}"]`);
  const num=k=>{const v=q(k).value.trim();if(v==="")return null;const x=Number(v);return isFinite(x)&&x>=0?x:NaN;};
  const name=q("name").value.trim();
  if(!name)return{err:"名前を入れてください"};
  const p=num("p"),kcal=num("kcal");
  if(p===null||kcal===null||isNaN(p)||isNaN(kcal))return{err:"たんぱく質とカロリーは必須です（0以上の数字）"};
  const n={p,kcal};
  for(const k of ["c","f","ca","ve","iso"]){const v=num(k);if(isNaN(v))return{err:"数字を入れてください"};n[k]=v===null?0:v;}
  const aliasRaw=q("alias").value.trim();
  const alias=aliasRaw?aliasRaw.split(/[,、，]/).map(s=>s.trim()).filter(Boolean):[];
  if(alias.indexOf(name)<0)alias.unshift(name);
  const tag=Array.from(root.querySelectorAll("[data-tag]")).filter(c=>c.checked).map(c=>c.dataset.tag);
  const out={name,alias,n,tag};
  if(create){
    out.type=q("type").value;
    if(out.type==="count"){
      out.unit=q("unit").value.trim()||"個";
      const g=num("g");if(isNaN(g))return{err:"1単位のグラムは数字で入れてください"};
      if(g)out.g=g;
    }else out.unit="g";
    out.list=q("list").value;
  }
  return out;
}
function sameAsBase(b,r){
  if(b.name!==r.name||b.alias.join("|")!==r.alias.join("|"))return false;
  for(const k of ["p","kcal","c","f","ca","ve","iso"])if(Number(b.n[k]||0)!==Number(r.n[k]||0))return false;
  return (b.tag||[]).slice().sort().join()===r.tag.slice().sort().join();
}
function saveEditor(){
  const root=$("editor");if(!root)return;
  const create=openEd==="create";
  const r=readEditor(root,create);
  if(r.err){root.querySelector('[data-f="msg"]').textContent=r.err;return;}
  clearMsgs();
  if(create){
    const food={id:"u_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
      name:r.name,alias:r.alias,type:r.type,unit:r.unit,n:r.n};
    if(r.g)food.g=r.g;
    if(r.tag.length)food.tag=r.tag;
    USER_FOODS.push(food);LS.set("userFoods",USER_FOODS);rebuildFoods();
    if(r.list){LISTS[r.list].push(food.id);saveLists();}
    openEd=null;
    createMsg=`「${r.name}」を作りました。`+(r.list?`${listLabel(r.list)}のリストの一番下に入っています。`:"入力欄で使えます。");
    renderSettings();
    if(r.list)flashRow(r.list,LISTS[r.list].length-1);
    return;
  }
  const k=openEd.list,i=openEd.idx,f=foodById(LISTS[k][i]);
  if(isBuiltin(f.id)){
    const base=BUILTIN_FOODS.find(b=>b.id===f.id);
    if(sameAsBase(base,r))delete OVERRIDES[f.id];
    else OVERRIDES[f.id]={name:r.name,alias:r.alias,n:r.n,tag:r.tag};
    LS.set("foodOverrides",OVERRIDES);
  }else{
    const u=USER_FOODS.find(x=>x.id===f.id);
    u.name=r.name;u.alias=r.alias;u.n=r.n;
    if(r.tag.length)u.tag=r.tag;else delete u.tag;
    LS.set("userFoods",USER_FOODS);
  }
  rebuildFoods();openEd=null;
  notices[k]={text:`「${r.name}」を保存しました`};
  renderSettings();flashRow(k,i);
}
function resetFood(){
  const k=openEd.list,i=openEd.idx,f=foodById(LISTS[k][i]);
  clearMsgs();
  delete OVERRIDES[f.id];LS.set("foodOverrides",OVERRIDES);rebuildFoods();
  openEd=null;
  notices[k]={text:`「${foodById(f.id).name}」を元の値に戻しました`};
  renderSettings();flashRow(k,i);
}
function deleteFood(){
  const k=openEd.list,f=foodById(LISTS[k][openEd.idx]);
  if(!confirm(`「${f.name}」を削除しますか？\n過去の記録の数字は残ります。`))return;
  clearMsgs();
  const u=USER_FOODS.find(x=>x.id===f.id);u.deleted=true;
  LS.set("userFoods",USER_FOODS);rebuildFoods();
  LIST_META.forEach(([key])=>{LISTS[key]=LISTS[key].filter(id=>id!==f.id);});
  saveLists();openEd=null;
  notices[k]={text:`「${f.name}」を削除しました`};
  renderSettings();
}

$("setPane").addEventListener("click",e=>{
  const b=e.target.closest("button");
  if(!b||!$("setPane").contains(b))return;
  const d=b.dataset;
  if(d.mv){const p=d.mv.split(":");moveItem(p[0],+p[1],+p[2]);return;}
  if(d.rm){const p=d.rm.split(":");removeItem(p[0],+p[1]);return;}
  if(d.undo){undoRemove(d.undo);return;}
  if(d.edit){
    const p=d.edit.split(":"),k=p[0],i=+p[1];
    const same=openEd&&openEd.list===k&&openEd.idx===i;
    clearMsgs();openEd=same?null:{list:k,idx:i};renderSettings();
    const ed=$("editor");
    if(ed&&ed.getBoundingClientRect().bottom>window.innerHeight)ed.scrollIntoView({block:"nearest"});
    return;
  }
  switch(d.act){
    case "create":clearMsgs();openEd="create";renderSettings();break;
    case "cancel":openEd=null;renderSettings();break;
    case "save":saveEditor();break;
    case "reset":resetFood();break;
    case "delete":deleteFood();break;
    case "resetLists":
      if(!confirm("リストを最初の並びに戻しますか？\n作った食材や値の修正は消えません。"))return;
      clearMsgs();openEd=null;LISTS=clone(DEFAULT_LISTS);cleanLists();saveLists();
      setMsg="リストを最初の並びに戻しました";renderSettings();break;
  }
});
$("setPane").addEventListener("change",e=>{
  const s=e.target,d=s.dataset;
  if(d.addto!==undefined){
    const k=d.addto,id=s.value;if(!id)return;
    clearMsgs();
    if(LISTS[k].indexOf(id)<0)LISTS[k].push(id);
    saveLists();renderSettings();flashRow(k,LISTS[k].length-1);
    return;
  }
  if(d.set){settings[d.set]=Number(s.value)||0;LS.set("settings",settings);return;}
  if(d.f==="type"){
    const root=$("editor"),count=s.value==="count";
    root.querySelectorAll("[data-countonly]").forEach(x=>x.classList.toggle("hidden",!count));
    root.querySelector("[data-basis]").textContent="↓ "+(count?"1単位あたり":"100gあたり")+"の数値";
  }
});

/* ---------- 初期化 ---------- */
$("hintText").textContent=HINT_DEFAULT;
$("chips").addEventListener("click",e=>{const b=e.target.closest("[data-add]");if(b)addFood(b.dataset.add,1);});
$("exSel").innerHTML=EXERCISES.map(e=>`<option>${e}</option>`).join("");
$("exSel").onchange=renderGym;

function addFood(id,qty){
  const i=day.meals.findIndex(m=>m.foodId===id);
  if(i>=0)day.meals[i].qty=r3(day.meals[i].qty+qty);
  else day.meals.push({foodId:id,qty});
  saveDay();render();
}

$("addBtn").onclick=()=>{
  const v=$("foodInput").value;if(!v.trim())return;
  const{hits,misses}=parseInput(v);
  if(!hits.length){$("hintText").textContent="わからない食材: "+misses.join(" ");return}
  hits.forEach(h=>{
    const i=day.meals.findIndex(m=>m.foodId===h.foodId);
    if(i>=0)day.meals[i].qty=r3(day.meals[i].qty+h.qty);
    else day.meals.push(h);});
  saveDay();$("foodInput").value="";
  $("hintText").textContent=misses.length?"登録できない食材: "+misses.join(" "):HINT_DEFAULT;
  render();
};
$("foodInput").onkeydown=e=>{if(e.key==="Enter")$("addBtn").click()};

$("wAdd").onclick=()=>{
  const kg=$("kgIn").value,reps=$("repIn").value;
  if(!kg||!reps)return;
  day.workouts.push({ex:$("exSel").value,kg:Number(kg),reps:Number(reps)});
  saveDay();$("repIn").value="";render();
};
$("repIn").onkeydown=e=>{if(e.key==="Enter")$("wAdd").click()};

$("prevDay").onclick=()=>{const d=new Date(date);d.setDate(d.getDate()-1);
  date=todayKey(d);day=LS.get("log:"+date,{meals:[],workouts:[]});render()};
$("nextDay").onclick=()=>{if(date>=todayKey())return;
  const d=new Date(date);d.setDate(d.getDate()+1);
  date=todayKey(d);day=LS.get("log:"+date,{meals:[],workouts:[]});render()};
function setTab(t){tab=t;clearMsgs();openEd=null;render();}
$("tabFood").onclick=()=>setTab("food");
$("tabGym").onclick=()=>setTab("gym");
$("tabSet").onclick=()=>setTab("set");
$("toSettings").onclick=()=>{setTab("set");window.scrollTo(0,0);};

render();
</script>
